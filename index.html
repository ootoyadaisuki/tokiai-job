<script>
window.GAME_DATA={"name":"土岐 あい","titleMain":"1万人プロジェクト","texts":{"obi":"1 0 , 0 0 0　W O M E N","sub":"所要時間 約5分","unit":"人","meterLabel":"女性起業家になった人","ruleIntro":"「ときあいです♡\n私がいま掲げているのが「女性起業家1万人プロジェクト」です。\nこれから、あなたにその1万人を、ゼロからつくってもらいます。\nスコアは『あなたのおかげで、女性起業家になった人』の数。\n最初はたった10人から。でも渡し方を間違えなければ、最後は1万人を超えます。\n私は23歳、口座に30万円で独立しました。特別な才能はいりません。\n必要なのは、淡々と、地味にコツコツと続ける力だけです。\nさあ、何人を起業家にできますか。」","profileKicker":"こ の 物 語 の 主 人 公","profileBody":"土岐あい（46）。チームビジネスプロデューサー・作家。株式会社エニシャ代表。23歳でWEB制作業として独立し、2010年に法人化。在宅ワーク育成スクールを主宰（受講生220名以上）、女性起業家協業支援協会（FEA・登録者約2,000名）で「女性起業家1万人プロジェクト」を掲げています。著書『確実に月10万稼げる「令和の内職」SNSサポート副業』（大和出版）。"},"rounds":[{"tag":"第1幕　最初の10人","title":"仕事の「型」をつくる","base":0,"desc":"目の前に2つありました。発信したいのに手が回らない経営者と、家から出られないけれど働きたい人。ここをつなぐ仕事の型をつくるところから始まります。まずは10人。","steps":[{"q":"発信したい経営者と、家から出られないけれど働きたい人。どうつなぐ？","opts":[{"t":"経営者に、外注先を紹介するだけにする","m":15,"c":"紹介で終わると、報酬もご縁も一度きりです。仕事の「型」は残りません。"},{"t":"自分が全部引き受ける","m":5,"c":"私の悪い癖です（笑）。1人で抱えている限り、起業家は1人も増えません。"},{"t":"経営者のSNS投稿を代行する仕事として、間に入る形をつくる","m":30,"c":"これが「SNSサポート」の原型です。私自身、妊娠中に自宅から出られない数ヶ月がありました。動けなくても、指一本あれば人とつながれる。最初はほんの数人でしたよ。"},{"t":"働きたい人に、制作スキルを一から教える","m":20,"c":"王道です。ただ、身につくまでに半年かかります。その半年、その人は1円も稼げません。"}]},{"q":"最初の受講生が「私にできることなんて、何もない」と言う。どうする？","opts":[{"t":"向いていないと正直に伝える","m":3,"c":"そこで諦めた人を、私は何人も見てきました。できないんじゃなくて、まだ気づいていないだけなんです。"},{"t":"稼げた人の成功事例を見せて、やる気を出してもらう","m":12,"c":"やる気には効きます。ただ、憧れだけでは手は動きません。"},{"t":"その人の「当たり前」を一緒に棚卸しして、値段をつける","m":30,"c":"あなたの「当たり前」は、誰かにとっての「すごいこと」です。日程調整が得意、文章を整えるのが早い。それ、全部お金になります。"},{"t":"新しいスキルを学んでもらう","m":18,"c":"増やすのは悪くありません。ただ、もう持っているものを見ないまま足しても、自信はつかないんです。"}]},{"q":"1件300円の仕事。「安すぎませんか」と言われた。どう答える？","opts":[{"t":"単価の高い仕事から始めてもらう","m":20,"c":"気持ちはわかります。ただ、高い仕事は責任も重い。最初の1件で折れてしまう人が多いんです。"},{"t":"慣れれば15分で終わる。時給1,200円から始めればいい、と伝える","m":40,"c":"派手な起業じゃない。地味な積み上げ、実業です。月10万円は、この積み重ねで届きます。"},{"t":"単価交渉の仕方を教える","m":24,"c":"いずれ必要です。ただ、実績ゼロの状態で交渉すると、だいたい仕事ごと無くなります。"},{"t":"確かに安いので、受けさせない","m":8,"c":"その1件が、その人の「初めて自分で稼いだお金」になるかもしれないのに。"}]}]},{"tag":"第2幕　200人の壁","title":"自分1人が教えられる数を、超える","base":0,"desc":"型はできました。受講希望の連絡も増えてきた。──でもこのままだと、私1人が教えられる数で頭打ちになります。ここからは、増やし方の勝負です。","steps":[{"q":"受講希望の連絡が、自分1人では受けきれなくなった。","opts":[{"t":"待たせたまま、様子を見る","m":90,"c":"4ヶ月待った人は、たいてい3ヶ月目に別のところへ行きます。"},{"t":"教えられる人を育てて、講師を増やす","m":600,"c":"相談の予約が4ヶ月待ちになったことがあります。私が全部やっている限り、待っている人はいつまでも減らないんです。"},{"t":"受付時間を増やして、自分でさばききる","m":180,"c":"1日は24時間しかありません。増やせる上限は、もう見えています。"},{"t":"価格を上げて、受ける人数を絞る","m":420,"c":"経営としては満点の答えです。賢い。でもそれをすると、いちばん来てほしかった人が来られなくなるんですよね。"}]},{"q":"「理想のお客様が分からない」と受講生に言われた。どう答える？","opts":[{"t":"条件を80項目まで書き出させて、全部言葉にさせる","m":600,"c":"私、自分の婚活でこれをやったんです（笑）。条件を言葉にできない人は、目の前にその人が来ても気づけません。仕事もまったく同じです。"},{"t":"うまくいっている人のペルソナを渡す","m":270,"c":"近道に見えます。でも借りた基準では、目の前の人を選べません。"},{"t":"まず数をこなして、感覚を掴ませる","m":360,"c":"現場主義ですね。私も好きです。ただ、基準がないまま数をこなすと、疲れるだけで残りません。"},{"t":"直感を信じさせる","m":150,"c":"直感って、基準を持っている人ほどよく当たるんです。順番が逆なんですよ。"}]},{"q":"1人では受けきれない案件が来た。受講生の誰も、単独では実力が足りない。","opts":[{"t":"いちばん近い1人に任せて、育てる","m":350,"c":"1人は育ちます。でも1人ずつしか育たないやり方で、1万人には届きません。"},{"t":"自分が入って、足りない部分を埋める","m":490,"c":"その案件は回ります。ただ、私が入った時点で、また私の体力が上限になります。"},{"t":"実力がつくまで、断る","m":140,"c":"断った案件は、たいてい二度と来ません。仕事の中でしか育たないこともあるんです。"},{"t":"得意な人同士を組ませて、チームで受けさせる","m":700,"c":"個のポンコツは、誰かのジーニアスで補えばいい。全部できる人なんていません。できないことがあるから、チームでやるんです。"}]}]},{"tag":"最終幕　1万人へ","title":"渡し方の、勝負","base":0,"desc":"1,000人が見えてきました。──でもここから1万人までは、いままでのやり方の延長では届きません。最後は、渡し方の勝負です。","steps":[{"q":"この仕事には、まだ名前がない。世の中にどう出す？","opts":[{"t":"実績が十分に貯まってから、世に出す","m":1500,"c":"誠実です。ただ「十分」がいつ来るかは、誰も教えてくれません。私はまだ途中で出しました。"},{"t":"業界の言葉のまま、丁寧に説明する","m":1000,"c":"正確です。でも、正確な説明は検索されないんです。"},{"t":"「スマホだけで誰でも月10万」と分かりやすく煽る","m":75,"c":"それは、私がいちばん嫌う売り方です。ああいう嘘に人生を狂わされた人を、何人も見てきました。"},{"t":"「令和の内職」と名前をつけて、1冊の本にする","m":2500,"c":"『確実に月10万稼げる「令和の内職」SNSサポート副業』です。名前のないものは、探せません。名前をつけた瞬間に、探していた人のほうから見つけてくれます。"}]},{"q":"もっと多くの人に知ってもらいたい。どうする？","opts":[{"t":"プレスリリースを1本、丁寧に書く","m":3000,"c":"1記事で43媒体に載ったことがあります。人生って、だいたい営業力。あとは、ご縁です。"},{"t":"SNSでバズを狙う","m":900,"c":"バズは一晩の花火です。翌朝には全員忘れています。"},{"t":"広告費を投じて、一気に露出させる","m":1800,"c":"広告で人は来ます。けど、広告で来た人は、広告が止まると同時にいなくなります。"},{"t":"有名な人に紹介を頼む","m":1500,"c":"看板は強いです。ただ、看板で集まった人は看板に付いていきます。"}]},{"q":"1,000人を超えた。ところが、ここから伸びが鈍ってきた。","opts":[{"t":"大企業と組んで、一気に広げる","m":1750,"c":"速いです。速さと引き換えに、1人ひとりの顔は見えにくくなります。"},{"t":"自分がもっと登壇して、露出を増やす","m":2100,"c":"効きます。ただ、私の体力がそのまま上限になる形からは、抜け出せていません。"},{"t":"スクールの定員を増やす","m":1400,"c":"順当です。でも定員を倍にしても、届くのは倍まで。桁は変わりません。"},{"t":"教わった人が、次の人に教える形にする","m":3500,"c":"私1人が教えられる数には、限りがあります。渡された人が渡す側に回った瞬間、数え方が変わるんです。"}]},{"q":"最後の問い。1万人を超えた先に、何を残す？","opts":[{"t":"質を保つために、会員を絞る","m":2400,"c":"質は守れます。ただ、守りに入った場所からは、次の1万人は生まれません。"},{"t":"ここで一区切りにする","m":1600,"c":"十分な数字です。でも私は、まだ本番が始まったばかりだと思っています。"},{"t":"認定資格をつくって、権威づける","m":2000,"c":"仕組みとしては正しいです。ただ、資格を取ることが目的になった瞬間、稼ぐ人が減るんです。"},{"t":"協業できる場をつくって、起業家同士が仕事を回せるようにする","m":4000,"c":"それが女性起業家協業支援協会（FEA）です。1万人は通過点。あなたの「得意」が、誰かの「希望」になります。──次は、あなたの番です。"}]}]}],"ranks":[{"min":10000,"r":"S","n":"1 万 人 達 成","m":4,"c":"見事です。1万人、超えました。ここまで積み上げたのは、あなたが「得意で稼げるようにしてあげた人」の数です。あなたはもう、教わる側ではなく渡す側の人ですね。あなたの「得意」が、誰かの「希望」になります。"},{"min":6000,"r":"A","n":"渡 す 側 の 人","m":3,"c":"立派です。あと少しで1万人でした。渡す側に回れた人は、もう自分の体力が上限ではありません。"},{"min":3000,"r":"B","n":"育 て る 人","m":2,"c":"いいですね。育てる側に立てています。あとは「教わった人が教える形」にできるかどうかです。"},{"min":1200,"r":"C","n":"型 を つ く っ た 人","m":1,"c":"型はできました。ここからは、1人で抱えないやり方を選べるかどうかですね。"},{"min":0,"r":"D","n":"ま だ 、 ひ と り","m":0,"c":"大丈夫。私も長いこと1人で抱えていました。万能である必要なんて、誰にもないんです。まず1つ、誰かに渡してみませんか。"}],"cta":{"url":"https://f-e-a.jp/user.php?id=2","label":"詳しくはこちら","quiet":"詳しくはこちら"},"links":[{"kind":"X","label":"@ai_loveyourself","url":"https://x.com/ai_loveyourself"},{"kind":"INSTAGRAM","label":"@ai_enisha","url":"https://www.instagram.com/ai_enisha/"},{"kind":"YOUTUBE","label":"YouTubeチャンネル","url":"https://www.youtube.com/@tokiai"},{"kind":"AMAZON","label":"著書一覧（Amazon）","url":"https://www.amazon.co.jp/%E5%9C%9F%E5%B2%90%E3%81%82%E3%81%84/e/B0FD9FNY6F/ref=dp_byline_cont_book_1"},{"kind":"WEB","label":"公式サイト","url":"https://f-e-a.jp/user.php?id=2"},{"kind":"LINK","label":"ai-c-a.com","url":"https:/ (function GAME_RUNTIME() {
  const D = window.GAME_DATA, F = D.face;
  /* Contena「ゲーム化サービス」への固定導線（トップ画面と最終判定画面に必ず出す） */
  const MAKER_URL = 'https://contena.co.jp/yourstory/';
  const MAKER_LABEL = 'あなたのゲームを作りませんか？';
  function makerLink(cls) {
    return '<a class="' + cls + '" href="' + MAKER_URL + '" target="_blank" rel="noopener">' + MAKER_LABEL + '</a>';
  }
  const app = document.getElementById('app');
  const fmt = n => Math.round(n).toLocaleString('ja-JP');
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const br = s => esc(s).replace(/\n/g, '<br>');

  /* ---- ドット絵 ---- */
  function drawFace(cv, mood, sc) {
    const g = cv.getContext('2d');
    cv.width = F.FW * sc; cv.height = F.FH * sc;
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, cv.width, cv.height);
    F.BASE.forEach(r => { g.fillStyle = F.PAL[r[3]]; g.fillRect(r[1]*sc, r[0]*sc, (r[2]-r[1]+1)*sc, sc); });
    const M = F.MOODS[Math.max(0, Math.min(4, mood))];
    g.fillStyle = F.PAL.t;
    (M.lid || []).forEach(p => g.fillRect(p[0]*sc, p[1]*sc, sc, sc));
    g.fillStyle = F.PAL.E;
    M.brow.forEach(p => g.fillRect(p[0]*sc, p[1]*sc, sc, sc));
    M.eye.forEach(p => g.fillRect(p[0]*sc, p[1]*sc, sc, sc));
    g.fillStyle = F.PAL[F.MCOL] || F.PAL.E;
    M.mouth.forEach(p => g.fillRect(p[0]*sc, p[1]*sc, sc, sc));
    F.OVER.forEach(r => { g.fillStyle = F.PAL[r[3]]; g.fillRect(r[1]*sc, r[0]*sc, (r[2]-r[1]+1)*sc, sc); });
  }
  function face(mood, sc) {
    return '<canvas class="face" data-mood="' + mood + '" data-sc="' + sc +
      '" style="width:' + (F.FW*sc) + 'px;height:' + (F.FH*sc) + 'px"></canvas>';
  }
  function paintFaces() {
    app.querySelectorAll('canvas.face').forEach(cv => drawFace(cv, +cv.dataset.mood, +cv.dataset.sc));
  }

  /* ---- 効果音（Web Audio合成） ---- */
  let AC = null, muted = false;
  function ac() {
    if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; AC = new C(); }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function nbuf(ctx, dur) {
    const n = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function tone(ctx, f0, f1, dur, gain, delay, type) {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + (delay || 0);
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(ctx, f0, f1, dur, gain, Q, delay, ftype) {
    const s = ctx.createBufferSource(); s.buffer = nbuf(ctx, dur);
    const bp = ctx.createBiquadFilter(), g = ctx.createGain(), t = ctx.currentTime + (delay || 0);
    bp.type = ftype || 'bandpass'; bp.Q.value = Q || 1;
    bp.frequency.setValueAtTime(f0, t);
    if (f1) bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.28);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp).connect(g).connect(ctx.destination); s.start(t); s.stop(t + dur + 0.03);
  }
  function sfx(kind) {
    if (muted) return;
    let ctx; try { ctx = ac(); } catch (e) { return; }
    if (!ctx) return;
    if (kind === 'page') { noise(ctx, 800, 2800, 0.26, 0.07, 0.7); tone(ctx, 320, 180, 0.09, 0.05); }
    else if (kind === 'stamp') { tone(ctx, 140, 58, 0.14, 0.28); noise(ctx, 1400, 600, 0.05, 0.14, 1.2); }
    else if (kind === 'tick') { tone(ctx, 2600, null, 0.018, 0.022, 0, 'square'); }
    else if (kind === 'thud') { tone(ctx, 110, 42, 0.3, 0.42); noise(ctx, 900, 220, 0.09, 0.24, 0.8, 0, 'lowpass'); }
  }
  document.addEventListener('pointerdown', e => {
    const b = e.target.closest('button,a');
    if (!b || b.id === 'mute') return;
    sfx(b.classList.contains('cta') ? 'page' : 'stamp');
  });
  document.getElementById('mute').addEventListener('click', function () {
    muted = !muted;
    this.textContent = muted ? '✕' : '♪';
    this.classList.toggle('off', muted);
    if (!muted) sfx('page');
  });

  /* ---- 状態 ---- */
  let ri = 0, si = 0, mult = 1, acc = 0, total = 0;
  /* 加算方式はスコアの軸が全ラウンド共通なので、メーターは章をまたいで積み上がる。
     total には完了した章の合計が入っているので、表示は total + 今章の acc。
     倍率方式は章ごとに基準値から測り直すので従来どおり。 */
  function roundNow(R) { return isAdd(R) ? acc : R.base * mult; }
  function shownNow(R) { return isAdd(R) ? total + acc : R.base * mult; }
  function show(html) {
    app.innerHTML = '<div class="fade" style="display:flex;flex-direction:column;flex:1">' + html + '</div>';
    paintFaces(); window.scrollTo(0, 0);
  }
  function restart() { ri = 0; si = 0; mult = 1; acc = 0; total = 0; opening(); }
  window.restart = restart;

  /* ---- ☰シート（🏠共通ルール: 状態リセット＋タイトル再描画。reloadしない） ---- */
  const sheetEl = document.getElementById('sheet');
  document.getElementById('menu').addEventListener('click', () => sheetEl.classList.add('open'));
  const closeSheet = () => sheetEl.classList.remove('open');
  document.getElementById('sheetHome').addEventListener('click', () => { closeSheet(); restart(); });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  sheetEl.addEventListener('click', e => { if (e.target === sheetEl) closeSheet(); });
  const sheetLp = document.getElementById('sheetLp');
  if (sheetLp) sheetLp.addEventListener('click', closeSheet);

  function ctaLink(cls, label) {
    if (!D.cta.url) return '';
    return '<a class="' + cls + '" href="' + esc(D.cta.url) + '" target="_blank" rel="noopener">' + esc(label) + '</a>';
  }
  /* 採点は2方式。base が 0 のラウンドは「選択肢の点数を足していく」加算方式、
     base があるラウンドは従来どおり「基準値に倍率を掛ける」方式。 */
  /* 縦書きタイトル用。半角スペースは半角のまま見えるよう、細いスペーサに置き換える */
  function vtName(s) {
    return String(s == null ? '' : s).split(/( +)/).map(function (p) {
      return /^ +$/.test(p)
        ? '<span class="sp" style="height:' + (p.length * 0.34) + 'em"></span>'
        : esc(p);
    }).join('');
  }
  function isAdd(R) { return !R.base; }
  /* 章ごとに測るものが変わってよい（例 1章デザインスキル→2章稼ぐ力→3章自立した人）。
     ラウンドに unit / meterLabel があればそれを使い、無ければ全体の texts を使う。
     累計・最終判定だけは全章共通の texts.unit で表示する。 */
  function uOf(R) { return (R && R.unit) || D.texts.unit; }
  function mOf(R) { return (R && R.meterLabel) || D.texts.meterLabel; }
  function stepMax(S) { return Math.max.apply(null, S.opts.map(function (o) { return o.m; })); }
  function roundMax(R) { return R.steps.reduce(function (a, S) { return a + stepMax(S); }, 0); }
  function roundMulMax(R) { return R.steps.reduce(function (a, S) { return a * stepMax(S); }, 1); }
  /* 第iラウンドまでの累計満点（加算方式のメーター上限） */
  function maxUpTo(i) {
    var m = 0;
    for (var k = 0; k <= i; k++) { var R = D.rounds[k]; if (isAdd(R)) m += roundMax(R); }
    return m;
  }
  /* 加算方式の手ごたえは「その設問の最高点に対して何割か」で測る。点数の桁が変わっても効く */
  function rateOf(R, S, o) {
    if (!isAdd(R)) return o.m >= 2.0 ? 1 : o.m >= 1.5 ? 0.8 : o.m >= 1.0 ? 0.5 : o.m >= 0.7 ? 0.25 : 0;
    const b = stepMax(S);
    return b > 0 ? o.m / b : 0;
  }
  function moodOf(r) { return r >= 0.9 ? 4 : r >= 0.65 ? 3 : r >= 0.4 ? 2 : r >= 0.2 ? 1 : 0; }
  function grade(r) { return r >= 0.9 ? '手ごたえ　◎' : r >= 0.65 ? '手ごたえ　○' : r >= 0.4 ? '手ごたえ　△' : '手ごたえ　×'; }
  function stampOf(r) {
    return r >= 0.92 ? '文 句 な し' : r >= 0.72 ? '大 躍 進' : r >= 0.45 ? '上 出 来' : '伸 び 悩 み';
  }

  /* ---- カウントアップ（rAFでなくsetInterval: 非表示スロットリング回避） ---- */
  function countTo(v, pct) {
    const el = document.getElementById('cnt'); if (!el) return;
    document.getElementById('bar').style.width = Math.min(100, pct) + '%';
    const dur = 900, t0 = Date.now();
    let lastTick = 0;
    clearInterval(countTo._id);
    countTo._id = setInterval(() => {
      const now = Date.now(), p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(v * e);
      if (p < 0.92 && now - lastTick > 68) { lastTick = now; sfx('tick'); }
      if (p >= 1) clearInterval(countTo._id);
    }, 16);
  }

  /* ---- 画面 ---- */
  function opening() {
    show(
      '<div class="title-wrap"><div class="cover"><div class="plate"><div class="vt">' +
      '<div class="by">' + vtName(D.name) + '<span class="p">の</span></div>' +
      '<div class="mt">' + esc(D.titleMain) + '</div>' +
      '</div></div><div class="obi">' + esc(D.texts.obi) + '</div></div></div>' +
      '<button class="cta" onclick="GAME.rule()">は じ め る</button>' +
      '<div class="title-sub">' + esc(D.texts.sub) + '</div>' +
      makerLink('lp-quiet')
    );
  }
  function rule() {
    show(
      '<div class="kicker">' + esc(D.texts.obi) + '</div>' +
      '<h1 style="font-size:clamp(22px,6vw,30px)">' + esc(D.name) + 'の<br>' + esc(D.titleMain) + '</h1>' +
      '<div class="face-center">' + face(2, 5) + '</div>' +
      '<div class="talk"><div class="who">' + esc(D.name) + '</div>' +
      '<div class="line">' + br(D.texts.ruleIntro) + '</div></div>' +
      '<div class="spacer"></div>' +
      '<button class="cta" onclick="GAME.startRound()">最初の試練へ</button>'
    );
  }
  function startRound() {
    const R = D.rounds[ri]; si = 0; mult = 1; acc = 0;
    const lead = !isAdd(R)
      ? 'スタート地点は ' + fmt(R.base) + ' ' + esc(uOf(R)) + '。ここからどこまで伸ばせるか。'
      : total > 0
        ? 'ここまで ' + fmt(total) + ' ' + esc(uOf(R)) + '。この試練で、さらに ' + fmt(roundMax(R)) + ' ' + esc(uOf(R)) + 'まで積める。'
        : 'この試練の満点は ' + fmt(roundMax(R)) + ' ' + esc(uOf(R)) + '。どこまで積めるか。';
    show(
      '<div class="kicker">' + (ri + 1) + ' / ' + D.rounds.length + '</div>' +
      '<div class="ms"><div class="tag">' + esc(R.tag) + '</div>' +
      '<div class="t">' + esc(R.title) + '</div>' +
      '<div class="d">' + br(R.desc) + '</div></div>' +
      '<div class="react">' + face(2, 4) +
      '<div class="talk"><div class="who">' + esc(mOf(R)) + '</div>' +
      '<div class="line">' + lead + '</div></div></div>' +
      '<div class="spacer"></div>' +
      '<button class="cta" onclick="GAME.step()">挑戦する</button>'
    );
  }
  function step() {
    const R = D.rounds[ri], S = R.steps[si];
    const bars = R.steps.map((_, i) => '<i class="' + (i < si ? 'on' : '') + '"></i>').join('');
    const opts = S.opts.map((o, i) =>
      '<button class="btn" onclick="GAME.pick(' + i + ')"><span class="no">' + 'ABCDEF'[i] + '</span>' + esc(o.t) + '</button>'
    ).join('');
    show(
      '<div class="kicker">' + esc(R.tag) + '</div>' +
      '<div class="step">' + bars + '</div>' +
      '<div class="ask">' + face(2, 2) + '<h2>' + esc(S.q) + '</h2></div>' +
      opts
    );
  }
  function pick(i) {
    const R = D.rounds[ri], S = R.steps[si], o = S.opts[i];
    if (isAdd(R)) acc += o.m; else mult *= o.m;
    const now = shownNow(R), rate = rateOf(R, S, o);
    const last = si === R.steps.length - 1;
    show(
      '<div class="kicker">' + esc(R.tag) + '</div>' +
      '<div class="ms" style="padding-bottom:14px"><div class="tag">選んだ手</div>' +
      '<div class="t" style="font-size:17px;margin-bottom:0">' + esc(o.t) + '</div>' +
      '<div class="d" style="margin-bottom:34px"></div></div>' +
      '<div class="react">' + face(moodOf(rate), 4) +
      '<div class="talk"><div class="who">' + esc(D.name) + '</div>' +
      '<div class="line">「' + br(o.c) + '」</div></div></div>' +
      '<div class="meter"><div class="lab"><span>' + esc(mOf(R)) + '</span><span>' + grade(rate) + '</span></div>' +
      '<div class="num"><span id="cnt">0</span><small>' + esc(uOf(R)) + '</small></div>' +
      '<div class="bar"><i id="bar"></i></div></div>' +
      '<div class="spacer"></div>' +
      '<button class="cta" onclick="' + (last ? 'GAME.result()' : 'GAME.next()') + '">' +
      (last ? '結果を見る' : '次の判断へ') + '</button>'
    );
    countTo(now, isAdd(R) ? now / maxUpTo(ri) * 100 : Math.min(100, mult / 12 * 100));
  }
  function next() { si++; step(); }
  function result() {
    const R = D.rounds[ri], score = roundNow(R); total += score;
    const done = isAdd(R) ? score / roundMax(R) : mult / roundMulMax(R);
    const last = ri === D.rounds.length - 1;
    /* 加算方式は「ここまでの累計」を大きく出し、この章での伸びを脇に添える */
    const cum = isAdd(R) ? total : score;
    show(
      '<div class="kicker">' + esc(R.tag) + '　結果</div>' +
      '<h2 style="font-size:18px;color:#cfc7b8">' + esc(R.title) + '</h2>' +
      '<div class="meter"><div class="lab"><span>' + esc(mOf(R)) + (isAdd(R) ? '　累計' : '') + '</span><span>' +
      (isAdd(R) ? '満点 ' + fmt(maxUpTo(ri)) : '基準 ' + fmt(R.base)) + esc(uOf(R)) + '</span></div>' +
      '<div class="num"><span id="cnt">0</span><small>' + esc(uOf(R)) + '</small></div>' +
      '<div class="bar"><i id="bar"></i></div>' +
      '<div class="stamp">' + stampOf(done) + '</div></div>' +
      '<div class="react">' + face(moodOf(done), 4) +
      '<div class="talk"><div class="who">' + (isAdd(R) ? 'こ の 試 練 で' : '累 計') + '</div>' +
      '<div class="line" style="font-size:20px">' +
      (isAdd(R) ? '＋' + fmt(score) : fmt(total)) + ' ' + esc(D.texts.unit) + '</div></div></div>' +
      '<div class="spacer"></div>' +
      '<button class="cta" onclick="' + (last ? 'GAME.ending()' : 'GAME.nextRound()') + '">' +
      (last ? '最終判定を見る' : '次の試練へ') + '</button>'
    );
    countTo(cum, Math.min(100, (isAdd(R) ? cum / maxUpTo(ri) : done) * 100));
    setTimeout(() => sfx('thud'), 560);
  }
  function nextRound() { ri++; startRound(); }
  function ending() {
    const rk = D.ranks.find(x => total >= x.min) || D.ranks[D.ranks.length - 1];
    const maxTotal = D.ranks[0].min * 1.4;
    show(
      '<div class="kicker">F I N A L</div>' +
      '<div class="meter" style="margin-top:0"><div class="lab"><span>全' + D.rounds.length + '試練 累計</span><span></span></div>' +
      '<div class="num"><span id="cnt">0</span><small>' + esc(D.texts.unit) + '</small></div>' +
      '<div class="bar"><i id="bar"></i></div></div>' +
      '<div class="rank">' + esc(rk.r) + '</div>' +
      '<div class="rankname">' + esc(rk.n) + '</div>' +
      '<div class="react">' + face(rk.m, 4) +
      '<div class="talk"><div class="who">' + esc(D.name) + '</div>' +
      '<div class="line">「' + br(rk.c) + '」</div></div></div>' +
      '<div class="spacer"></div>' +
      '<button class="cta" onclick="GAME.profile()">つづきを読む</button>' +
      '<button class="btn" style="margin-top:10px;text-align:center;border-left:none;background:#16130f;color:#a89f92;border:1px solid #2c261f" onclick="GAME.restart()">もう一度やる</button>' +
      makerLink('lp-quiet')
    );
    countTo(total, Math.min(100, total / maxTotal * 100));
  }
  function profile() {
    const links = D.links.map(L =>
      '<a class="btn" style="text-decoration:none;display:block" href="' + esc(L.url) + '" target="_blank" rel="noopener">' +
      '<span class="no">' + esc(L.kind) + '</span>' + esc(L.label) + '</a>'
    ).join('');
    show(
      '<div class="kicker">' + esc(D.texts.profileKicker) + '</div>' +
      '<div class="react" style="align-items:flex-start">' + face(3, 5) +
      '<div style="flex:1;min-width:0"><h2 style="margin:4px 0 8px">' + esc(D.name) + '</h2>' +
      '<p class="small" style="margin:0">' + br(D.texts.profileBody) + '</p></div></div>' +
      links +
      (D.cta.url ? ctaLink('cta', D.cta.label) + '<div class="title-sub" style="margin-top:8px">（別のタブで開きます）</div>' : '') +
      '<button class="btn" style="margin-top:16px;text-align:center;border-left:none;background:#16130f;color:#a89f92;border:1px solid #2c261f" onclick="GAME.restart()">トップに戻る</button>' +
      '<div class="spacer"></div>'
    );
  }

  window.GAME = { rule, startRound, step, pick, next, result, nextRound, ending, profile, restart };
  opening();
})();
</script>
</body>
</html>
